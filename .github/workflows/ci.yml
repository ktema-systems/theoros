name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The frame is a file: dependency and is not committed, so it has to be on disk before npm resolves the tree.
      - run: node tools/frame.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
